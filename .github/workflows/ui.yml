name: ui-snapshots

on:
  push:
    paths: ["firmware/ui/**", "firmware/include/lv_conf.h", "tools/snapshot/**", "mock/**", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["firmware/ui/**", "firmware/include/lv_conf.h", "tools/snapshot/**", "mock/**", ".github/workflows/ui.yml"]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 mock/validate.py
      - run: tools/snapshot/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: out/*.png
