; Desk Health Dashboard firmware — Waveshare ESP32-S3-LCD-4.3 (800×480 RGB, 16 MB flash, 8 MB OPI PSRAM).
; Built in GitHub Actions (.github/workflows/firmware.yml); secrets come from include/secrets.h (gitignored).

[platformio]
default_envs = esp32s3

[env:esp32s3]
; pioarduino = PlatformIO platform with Arduino-ESP32 3.x (3.3.12), needed by ESP32_Display_Panel 1.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0          ; logs on the board's UART USB-C port
    -DLV_CONF_INCLUDE_SIMPLE
    -DESP_PANEL_BOARD_INCLUDE_CUSTOM_SIMPLE
    -I include
    -Wno-unused-parameter

lib_ldf_mode = chain
; dependencies before dependents, so nothing has to be resolved from the registry
lib_deps =
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/lvgl/lvgl.git#v9.3.0
    desk_ui=symlink://ui
